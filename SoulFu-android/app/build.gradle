plugins {
    id 'com.android.application'
}

android {
    namespace 'com.game.soulfu'
    compileSdk 34

    defaultConfig {
        applicationId "com.game.soulfu"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 1. Configure CMake arguments & specify ABI architectures
        externalNativeBuild {
            cmake {
                // Ensures standard C++ runtime sharing if dependencies need C++
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        // Build ABIs for 32-bit & 64-bit ARM/x86 architectures
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // 2. Point Gradle to your root CMakeLists.txt file
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets {
        main {
            java.srcDirs += 'src/main/cpp/SDL2/android-project/app/src/main/java/'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}